<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delivery Log</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#141516">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f1f2f3;--card:#fff;--ink:#16181a;--mut:#6a6e73;--line:#dfe1e4;--acc:#3d6ea6;--accbg:#e4ecf6;--on:#fff;--sh:0 1px 2px rgba(20,22,24,.06),0 4px 14px rgba(20,22,24,.05);color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#141516;--card:#1d1f21;--ink:#e6e7e8;--mut:#9a9da1;--line:#2b2d30;--acc:#7fa3cc;--accbg:#26303c;--on:#0e1620;--sh:none;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{padding:calc(12px + env(safe-area-inset-top)) 0 calc(92px + env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;padding:0 14px}
h1{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.top{display:flex;align-items:center;gap:10px;margin:4px 0 14px}
.top h1{flex:1}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card>b:first-child,.card>.row.sp:first-child>b{font-size:12.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
input{width:100%;height:48px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid transparent;border-radius:12px;padding:0 14px;margin:0 0 8px;outline:none}
input:focus{border-color:var(--acc);background:var(--card)}
input[type=checkbox]{width:auto;height:auto}
button,a.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:0 16px;min-height:48px;background:var(--acc);color:var(--on);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;white-space:nowrap}
button.g,a.btn{background:var(--accbg);color:var(--acc)}
button.s{min-height:34px;padding:0 12px;font-size:14px;border-radius:999px}
button:active{transform:scale(.98)}
button:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.sp{justify-content:space-between}
.mut{color:var(--mut);font-size:14px}
.stop{border-top:1px solid var(--line);padding:14px 0}
.stop:first-child{border-top:0;padding-top:4px}
.stop.done{opacity:.5}
.stop.done b{text-decoration:line-through}
.stop>.row:not(.sp){margin-top:10px}
.sps,#ppsis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin-top:8px}
.sps input,#ppsis input{margin:0}
.sp-note{margin:8px 0 0!important}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:4px;background:var(--card);box-shadow:0 -1px 0 var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.nav button{flex:1;flex-direction:column;gap:2px;min-height:54px;padding:6px 0;background:transparent;color:var(--mut);font-size:11.5px;border-radius:12px}
.nav button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--acc);background:var(--accbg)}
#map{height:62vh;min-height:320px;border-radius:16px}
.toast{position:fixed;left:14px;right:14px;bottom:calc(88px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;display:none;text-align:center;z-index:30;font-size:15px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.hide{display:none!important}
.del{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
dialog{border:0;border-radius:18px;background:var(--card);color:var(--ink);width:min(92vw,480px);padding:18px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
dialog::backdrop{background:#0009}
gmp-place-autocomplete{width:100%;margin-bottom:8px;color-scheme:light}
.iw{color:#101a19;font:14px/1.4 system-ui,sans-serif}
</style>
</head>
<body>
<main>
  <div id="login" class="hide card">
    <h1 style="margin-bottom:14px">Delivery Log</h1>
    <input id="em" type="email" placeholder="Email" autocomplete="username">
    <input id="pw" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" style="width:100%">Sign in</button>
  </div>

  <div id="app" class="hide">
    <div class="top"><h1>Delivery Log</h1><span class="mut" id="pend"></span><button class="g s" id="logout">Sign out</button></div>

    <div id="keybox" class="card hide">
      <b>Add your Google Maps key</b>
      <p class="mut" style="margin:6px 0 10px">Needed for shop search, the map and scanning. It’s saved only on this device.</p>
      <input id="keyin" placeholder="Paste key here">
      <button id="keysave" style="width:100%">Save key</button>
    </div>

    <section id="v-run">
      <div class="card">
        <b>To deliver</b>
        <div id="stops" style="margin:8px 0"></div>
        <button class="g s hide" id="clrdone">Clear delivered</button>
      </div>
      <div class="card">
        <div class="row sp"><b>Quick add</b><button class="g s" id="shopedit">✎ Edit</button></div>
        <input id="shopfilter" placeholder="Filter shops" style="margin:8px 0">
        <div id="shopchips" class="row" style="flex-wrap:wrap;max-height:190px;overflow:auto"></div>
      </div>
      <div class="card">
        <b>Add a stop</b>
        <div id="searchbox" style="margin-top:8px"><input id="plainshop" placeholder="Shop name"></div>
        <label id="mechrow" class="mut hide" style="display:flex;gap:8px;align-items:center;margin:0 0 8px"><input type="checkbox" id="mechonly" checked style="width:auto;margin:0"> Car businesses only (faster)</label>
        <div id="ppsis"><input class="pp" placeholder="PSI" inputmode="decimal"></div>
        <div class="row"><button class="g" id="pmore">+ PSI</button><button class="g" id="pcam">📷</button><button id="padd" style="flex:1">Add stop</button></div>
      </div>
    </section>

    <section id="v-ret" class="hide">
      <div class="card">
        <b>Log a pickup</b>
        <div class="mut" style="margin:6px 0">Shop</div>
        <input id="rshopfilter" placeholder="Filter shops" style="margin-bottom:8px">
        <div id="rshopchips" class="row" style="flex-wrap:wrap;max-height:160px;overflow:auto;margin-bottom:8px"></div>
        <div class="mut" style="margin:0 0 6px">Or search</div>
        <div id="rsearch"><input id="rplain" placeholder="Search a shop"></div>
        <div id="rsel" class="mut" style="margin:0 0 8px"></div>
        <input id="rnote" placeholder="Note (what was picked up, optional)">
        <img id="rimg" alt="" style="display:none;max-width:100%;border-radius:8px;margin-bottom:8px">
        <div class="row"><button class="g" id="rcam">📷 Photo</button><button id="radd" style="flex:1">Log pickup</button></div>
      </div>
      <div class="row sp" style="margin-bottom:8px"><span class="mut">Day</span><input class="dayin" type="date" style="width:auto;margin:0"></div>
      <div class="card"><div id="rlist"></div></div>
    </section>

    <section id="v-map" class="hide">
      <div class="row sp" style="margin-bottom:8px"><span class="mut">Day</span><input class="dayin" type="date" style="width:auto;margin:0"></div>
      <div id="map"></div>
      <p class="mut" id="mapnote"></p>
    </section>

    <section id="v-log" class="hide">
      <div class="row sp" style="margin-bottom:8px"><span class="mut">Day</span><input class="dayin" type="date" style="width:auto;margin:0"></div>
      <div class="card"><div id="loglist"></div>
        <div class="row sp" style="margin-top:10px"><span class="mut" id="tot"></span><span class="row"><button id="exp" class="g">⬇ Export</button><button id="mail" class="g">✉️ Email</button></span></div>
      </div>
    </section>
  </div>
</main>

<div class="nav hide" id="nav"><button data-t="run" class="on"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7l9-4 9 4v10l-9 4-9-4V7z"/><path d="M3 7l9 4 9-4M12 11v10"/></svg><span>To deliver</span></button><button data-t="ret"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg><span>Returns</span></button><button data-t="map"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-5.2 7-11a7 7 0 1 0-14 0c0 5.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span>Map</span></button><button data-t="log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg><span>Log</span></button></div>
<dialog id="dlg"><div id="dlgbody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
// Put your Google key between the quotes to build it into the site (then nobody has to paste it on their phone).
const GOOGLE_KEY='';
const gKey=()=>GOOGLE_KEY||localStorage.getItem('gmkey');
const sb=supabase.createClient('https://yznhzcqqtufxkdkxxqmv.supabase.co','sb_publishable__PLrzW0x4Gqd8fq1gFwPIw_fgK-CWbY');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
const dstr=d=>{const x=new Date(d);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
const pf=a=>a&&a.length?a.map(n=>'PSI-'+n).join(', '):'No PSI';
const TEAMS_ON=false; // change to true once the Teams function is set up
const isNet=e=>!navigator.onLine||/fetch|network|load failed|timeout|offline/i.test(String(e&&e.message||e));
let pickups=[],pickedR=null,rPhoto=null,stops=[],logs=[],picked=null,G={},map=null,mk=[],iw=null,tab='run',day=dstr(Date.now()),pend={},queue=[],flushing=false,cur=null;
try{queue=JSON.parse(localStorage.getItem('dlq')||'[]')}catch(e){}
const updPend=()=>{$('pend').textContent=queue.length?'⏳ '+queue.length+' waiting':''};
const saveQ=()=>{try{localStorage.setItem('dlq',JSON.stringify(queue))}catch(e){}updPend()};

function toast(t,ms=4500){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',ms)}
const nums=sel=>[...document.querySelectorAll(sel)].map(i=>parseFloat(i.value)).filter(n=>!isNaN(n));
function addField(c,cls,v){const i=document.createElement('input');i.className=cls;i.placeholder='PSI';i.inputMode='decimal';if(v!=null)i.value=v;c.appendChild(i);return i}

/* ---------- auth ---------- */
async function boot(){const {data}=await sb.auth.getSession();data.session?start():$('login').classList.remove('hide')}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)toast(error.message);else{$('login').classList.add('hide');start()}};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function start(){
  $('app').classList.remove('hide');$('nav').classList.remove('hide');updPend();renderShops();loadShops();
  document.querySelectorAll('.dayin').forEach(i=>{i.value=day;i.onchange=()=>{day=i.value;document.querySelectorAll('.dayin').forEach(x=>x.value=day);loadLogs()}});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  window.addEventListener('online',flush);setInterval(flush,30000);
  await flush();await Promise.all([loadStops(),loadLogs()]);
  setupMaps();
}

/* ---------- data ---------- */
async function loadStops(){
  let data;
  const r=await sb.from('plan_stops').select('*').order('sort_order').order('created_at');
  if(r.error){
    if(!isNet(r.error))return toast(r.error.message);
    try{data=JSON.parse(localStorage.getItem('dlstops')||'null')}catch(e){}
    if(!data)return toast('Offline and no saved list yet.');
    toast('Offline. Showing your saved list.');
  }else{data=r.data||[];try{localStorage.setItem('dlstops',JSON.stringify(data))}catch(e){}}
  stops=data.map(s=>{const q=queue.find(x=>x.stopId===s.id);return q?{...s,done:true,psi:q.row.psi}:s});
  renderStops();
}
async function loadLogs(){
  const a=new Date(day+'T00:00:00'),b=new Date(a.getTime()+864e5);
  const {data,error}=await sb.from('deliveries').select('*').gte('delivered_at',a.toISOString()).lt('delivered_at',b.toISOString()).order('delivered_at');
  if(error){if(!isNet(error))toast(error.message);return}
  logs=data||[];await loadPickups(a,b);renderLog();renderPickups();renderMap();
}
function groups(){
  const g={},add=(x,k)=>(g[k]=g[k]||{name:x.shop_name,address:x.address,lat:x.lat,lng:x.lng,items:[],picks:[]});
  logs.forEach(l=>add(l,l.place_id||l.shop_name.toLowerCase()).items.push(l));
  pickups.forEach(p=>add(p,p.place_id||p.shop_name.toLowerCase()).picks.push(p));
  return Object.values(g);
}

/* ---------- photos + sending (with offline queue) ---------- */
function shrink(f,max,q){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{const s=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',q))};im.onerror=rej;im.src=u})}
function pickPhoto(cb){
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.style.display='none';document.body.appendChild(inp);
  inp.onchange=async()=>{const f=inp.files[0];inp.remove();if(f)cb(await shrink(f,1000,.55))};inp.click();
}
async function uploadPhoto(du){
  const {data:u}=await sb.auth.getUser();if(!u.user)return null;
  const path=u.user.id+'/'+Date.now()+'.jpg',blob=await (await fetch(du)).blob();
  const r=await sb.storage.from('invoices').upload(path,blob,{contentType:'image/jpeg'});
  return r.error?null:path;
}
async function pushDelivery(it){
  if(it.kind==='pickup'){const pr={...it.row};if(it.photo){const pp=await uploadPhoto(it.photo);if(pp)pr.photo_path=pp}const r=await sb.from('pickups').upsert(pr,{onConflict:'id'});if(r.error)throw r.error;return}
  const row={...it.row};
  if(it.photo){const p=await uploadPhoto(it.photo);if(p)row.invoice_path=p}
  const ins=await sb.from('deliveries').upsert(row,{onConflict:'id'});if(ins.error)throw ins.error;
  if(it.stopId)await sb.from('plan_stops').update({done:true,psi:row.psi}).eq('id',it.stopId);
  if(TEAMS_ON){const n=await sb.functions.invoke('teams-notify',{body:row});
  if(n.error||(n.data&&n.data.error))toast('Logged, but the Teams message failed.',6000)}
}
async function flush(){
  if(!queue.length||flushing||!navigator.onLine)return;flushing=true;let n=0;
  for(const it of [...queue]){try{await pushDelivery(it);queue=queue.filter(x=>x!==it);saveQ();n++}catch(e){break}}
  flushing=false;if(n){toast('Sent '+n+' saved deliver'+(n>1?'ies':'y')+'.');loadStops();loadLogs()}
}

/* ---------- run plan ---------- */
const navUrl=s=>'https://www.google.com/maps/dir/?api=1&destination='+(s.lat!=null?s.lat+','+s.lng+(s.place_id?'&destination_place_id='+encodeURIComponent(s.place_id):''):encodeURIComponent(s.shop_name));
const drafts={};
function snapDrafts(){
  document.querySelectorAll('.sps').forEach(c=>{const id=c.dataset.id;(drafts[id]=drafts[id]||{}).psi=[...c.querySelectorAll('.sp-in')].map(i=>i.value)});
  document.querySelectorAll('.sp-note').forEach(n=>{(drafts[n.dataset.id]=drafts[n.dataset.id]||{}).note=n.value});
}
function renderStops(){
  snapDrafts();
  $('stops').innerHTML=stops.map((s,i)=>{
    const head=`<div class="row sp"><b>${i+1}. ${esc(s.shop_name)}</b>${s.done?'':`<span class="row"><button class="g s" data-up="${s.id}">▲</button><button class="g s" data-dn="${s.id}">▼</button><button class="g s" data-rm="${s.id}">✕</button></span>`}</div>`;
    if(s.done)return `<div class="stop done">${head}<div class="mut">Delivered · ${esc(pf(s.psi))}</div></div>`;
    const dp=(drafts[s.id]||{}).psi,pv=(dp&&dp.length?dp:(s.psi&&s.psi.length?s.psi:['']));
    return `<div class="stop">${head}${s.address?`<div class="mut">${esc(s.address)}</div>`:''}<div class="sps" data-id="${s.id}" style="margin-top:8px">${pv.map(v=>`<input class="sp-in" data-id="${s.id}" value="${esc(v)}" placeholder="PSI" inputmode="decimal">`).join('')}</div><input class="sp-note" data-id="${s.id}" value="${esc((drafts[s.id]||{}).note||'')}" placeholder="Note (optional)"><div class="row"><button class="g" data-add="${s.id}">+ PSI</button><button class="g" data-cam="${s.id}">📷</button><a class="btn" href="${navUrl(s)}" target="_blank" rel="noopener">🧭</a><button data-ok="${s.id}" style="flex:1">✓ Delivered</button></div></div>`;
  }).join('')||'<p class="mut">No stops yet. Tap a shop in Quick add, or search below.</p>';
  $('clrdone').classList.toggle('hide',!stops.some(s=>s.done));renderRet();
  try{localStorage.setItem('dlstops',JSON.stringify(stops))}catch(e){}
}
$('stops').onclick=async e=>{
  const b=e.target.closest('button');if(!b)return;
  const id=b.dataset.ok||b.dataset.add||b.dataset.cam||b.dataset.up||b.dataset.dn||b.dataset.rm,i=stops.findIndex(s=>s.id===id);
  if(b.dataset.cam){scan(document.querySelector(`.sps[data-id="${id}"]`),'sp-in',id,b)}
  else if(b.dataset.add){const c=document.querySelector(`.sps[data-id="${id}"]`);addField(c,'sp-in').dataset.id=id;c.lastChild.focus()}
  else if(b.dataset.ok){
    const psi=nums(`.sp-in[data-id="${id}"]`);
    const s=stops[i],nt=document.querySelector(`.sp-note[data-id="${id}"]`);
    const it={stopId:id,photo:pend[id]||null,row:{id:crypto.randomUUID(),shop_name:s.shop_name,place_id:s.place_id,address:s.address,lat:s.lat,lng:s.lng,psi,note:(nt&&nt.value.trim())||null,delivered_at:new Date().toISOString()}};
    b.disabled=true;
    try{
      if(!navigator.onLine)throw new Error('offline');
      await pushDelivery(it);toast('Logged '+s.shop_name+' · '+pf(psi));
    }catch(err){
      if(isNet(err)){queue.push(it);saveQ();toast('No signal. Saved on your phone and will send when you’re back online.',7000)}
      else{b.disabled=false;return toast(err.message||'Could not log it.')}
    }
    delete pend[id];day=dstr(Date.now());document.querySelectorAll('.dayin').forEach(x=>x.value=day);
    s.done=true;s.psi=psi;delete drafts[id];renderStops();loadLogs();
  }else if(b.dataset.up||b.dataset.dn){
    const j=b.dataset.up?i-1:i+1;if(j<0||j>=stops.length)return;
    [stops[i],stops[j]]=[stops[j],stops[i]];
    renderStops();
    Promise.all(stops.map((s,k)=>sb.from('plan_stops').update({sort_order:k}).eq('id',s.id))).catch(()=>{});
  }else if(b.dataset.rm){
    if(confirm('Remove this stop?')){stops.splice(i,1);renderStops();sb.from('plan_stops').delete().eq('id',id).then(()=>{})}
  }
};
$('clrdone').onclick=()=>{stops=stops.filter(s=>!s.done);renderStops();sb.from('plan_stops').delete().eq('done',true).then(()=>{})};
$('pmore').onclick=()=>addField($('ppsis'),'pp').focus();
$('padd').onclick=async()=>{
  const name=((picked&&picked.name)||(G.ac?G.ac.value:($('plainshop')||{}).value)||'').trim();
  if(!name)return toast('Enter or search for a shop.');
  const row={shop_name:name,psi:nums('.pp'),sort_order:stops.length};
  if(picked)Object.assign(row,{place_id:picked.place_id,address:picked.address,lat:picked.lat,lng:picked.lng});
  const r=await sb.from('plan_stops').insert(row).select().single();if(r.error)return toast(r.error.message);
  stops.push(r.data);renderStops();
  saveShop({name,place_id:row.place_id,address:row.address,lat:row.lat,lng:row.lng});
  picked=null;if(G.ac)G.ac.value='';else $('plainshop').value='';
  $('ppsis').innerHTML='<input class="pp" placeholder="PSI" inputmode="decimal">';
  if(!row.lat&&G.maps)toast('Added without a map pin. Pick a result from the search list to get a pin.');
};

/* ---------- my shops (quick list) ---------- */
let myShops=[],editShops=false;
try{myShops=JSON.parse(localStorage.getItem('dlshops')||'[]')}catch(e){}
async function loadShops(){
  const r=await sb.from('shops').select('*').order('name');if(r.error)return;
  myShops=r.data||[];try{localStorage.setItem('dlshops',JSON.stringify(myShops))}catch(e){}renderShops();
}
async function saveShop(x){
  const name=x.name,key=x.place_id||String(name).trim().toLowerCase();
  if(myShops.some(s=>s.key===key))return;
  const r=await sb.from('shops').upsert({name,key,place_id:x.place_id||null,address:x.address||null,lat:x.lat??null,lng:x.lng??null},{onConflict:'user_id,key',ignoreDuplicates:true});
  if(!r.error)loadShops();
}
function renderShops(){
  [['shopchips','shopfilter'],['rshopchips','rshopfilter']].forEach(([c,f])=>{
    const el=$(c);if(!el)return;const q=($(f).value||'').trim().toLowerCase();
    const list=myShops.filter(s=>!q||s.name.toLowerCase().includes(q));
    el.innerHTML=list.map(s=>`<button class="g s" data-sh="${s.id}">${editShops?'✕ ':''}${esc(s.name)}</button>`).join('')||`<span class="mut">${myShops.length?'No match.':'Shops you add or log are saved here.'}</span>`;
  });
}
async function shopTap(e,mode){
  const b=e.target.closest('button');if(!b||!b.dataset.sh)return;
  const s=myShops.find(x=>x.id===b.dataset.sh);if(!s)return;
  if(editShops){if(confirm('Remove '+s.name+' from your list?')){await sb.from('shops').delete().eq('id',s.id);loadShops()}return}
  if(mode==='add'){
    const r=await sb.from('plan_stops').insert({shop_name:s.name,place_id:s.place_id,address:s.address,lat:s.lat,lng:s.lng,psi:[],sort_order:stops.length}).select().single();
    if(r.error)return toast(isNet(r.error)?'No signal. Try again when you’re back online.':r.error.message);
    stops.push(r.data);renderStops();toast('Added '+s.name+'.',2500);
  }else{pickedR={name:s.name,address:s.address,lat:s.lat,lng:s.lng,place_id:s.place_id};renderRet()}
}
$('shopchips').onclick=e=>shopTap(e,'add');$('rshopchips').onclick=e=>shopTap(e,'ret');
$('shopfilter').oninput=renderShops;$('rshopfilter').oninput=renderShops;
$('shopedit').onclick=()=>{editShops=!editShops;$('shopedit').textContent=editShops?'Done':'✎ Edit';renderShops()};

/* ---------- log, edit, export, email ---------- */
function renderLog(){
  $('loglist').innerHTML=groups().map(g=>`<div class="stop"><b>📍 ${esc(g.name)}</b> ${g.items.length?`<span class="mut">×${g.items.length}</span>`:''}${g.items.map(l=>`<div class="del"><span>${fmt(l.delivered_at)} — <b>${esc(pf(l.psi))}</b>${l.invoice_path?' 📎':''}${l.note?`<br><span class="mut">${esc(l.note)}</span>`:''}</span><button class="g s" data-e="${l.id}">Edit</button></div>`).join('')}${g.picks.map(p=>`<div class="del"><span>↩ ${fmt(p.picked_at)} — Pickup${p.photo_path?' 📎':''}${p.note?`<br><span class="mut">${esc(p.note)}</span>`:''}</span><button class="g s" data-pk="${p.id}">View</button></div>`).join('')}</div>`).join('')||'<p class="mut">No deliveries for this day.</p>';
  $('tot').textContent=logs.length+' deliver'+(logs.length==1?'y':'ies')+(pickups.length?' · '+pickups.length+' pickup'+(pickups.length>1?'s':''):'');
}
$('loglist').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.e)openEdit(b.dataset.e);else if(b&&b.dataset.pk)openPickup(b.dataset.pk)};
async function openEdit(id){
  const l=logs.find(x=>x.id===id);if(!l)return;cur={photo:null};$('dlgbody').onclick=null;
  const d=new Date(l.delivered_at),hh=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  $('dlgbody').innerHTML=`<b>Edit delivery</b><div style="margin:10px 0"><input id="e-shop" value="${esc(l.shop_name)}" placeholder="Shop"><input id="e-psi" value="${esc((l.psi||[]).join(', '))}" placeholder="PSI, separated by commas (blank if none)" inputmode="decimal"><input id="e-time" type="time" value="${hh}"><input id="e-note" value="${esc(l.note||'')}" placeholder="Note"><img id="e-img" alt="Invoice" style="max-width:100%;border-radius:8px;display:none;margin-bottom:8px"><button class="g" id="e-photo" style="width:100%">📷 ${l.invoice_path?'Replace':'Add'} invoice photo</button></div><div class="row"><button id="e-save" style="flex:1">Save</button><button class="g" id="e-del">Delete</button><button class="g" id="e-x">Cancel</button></div>`;
  $('dlg').showModal();
  $('e-x').onclick=()=>$('dlg').close();
  $('e-photo').onclick=()=>pickPhoto(du=>{cur.photo=du;const im=$('e-img');im.src=du;im.style.display='block';$('e-photo').textContent='Photo ready. Tap Save.'});
  $('e-del').onclick=async()=>{
    if(!confirm('Delete this delivery?'))return;
    if(l.invoice_path)await sb.storage.from('invoices').remove([l.invoice_path]);
    const r=await sb.from('deliveries').delete().eq('id',l.id);if(r.error)return toast(r.error.message);
    $('dlg').close();loadLogs();
  };
  $('e-save').onclick=async()=>{
    const psi=$('e-psi').value.split(/[,\s]+/).map(parseFloat).filter(n=>!isNaN(n)),shop=$('e-shop').value.trim();
    if(!shop)return toast('A shop name is needed.');
    const [h,m]=($('e-time').value||hh).split(':').map(Number),nd=new Date(l.delivered_at);nd.setHours(h,m);
    const upd={shop_name:shop,psi,note:$('e-note').value.trim()||null,delivered_at:nd.toISOString()};
    if(cur.photo){const p=await uploadPhoto(cur.photo);if(p){if(l.invoice_path)await sb.storage.from('invoices').remove([l.invoice_path]);upd.invoice_path=p}else toast('Photo upload failed. Saved the rest.')}
    const r=await sb.from('deliveries').update(upd).eq('id',l.id);if(r.error)return toast(r.error.message);
    $('dlg').close();loadLogs();
  };
  if(l.invoice_path){const r=await sb.storage.from('invoices').createSignedUrl(l.invoice_path,3600);if(r.data&&$('e-img')){const im=$('e-img');im.src=r.data.signedUrl;im.style.display='block'}}
}
$('exp').onclick=()=>{
  $('dlgbody').onclick=null;
  $('dlgbody').innerHTML=`<b>Export deliveries</b><div style="margin:10px 0"><label class="mut">From</label><input id="x-from" type="date" value="${day}"><label class="mut">To</label><input id="x-to" type="date" value="${day}"></div><div class="row"><button id="x-go" style="flex:1">Download CSV</button><button class="g" id="x-x">Cancel</button></div>`;
  $('dlg').showModal();$('x-x').onclick=()=>$('dlg').close();
  $('x-go').onclick=async()=>{
    const a=new Date($('x-from').value+'T00:00:00'),b=new Date(new Date($('x-to').value+'T00:00:00').getTime()+864e5);
    const r=await sb.from('deliveries').select('*').gte('delivered_at',a.toISOString()).lt('delivered_at',b.toISOString()).order('delivered_at').limit(5000);
    if(r.error)return toast(r.error.message);
    const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
    const csv='\ufeffDate,Time,Shop,Address,PSI,Note\n'+r.data.map(l=>{const d=new Date(l.delivered_at);return [dstr(d),d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}),l.shop_name,l.address,(l.psi||[]).map(n=>'PSI-'+n).join(' '),l.note].map(q).join(',')}).join('\n');
    const u=URL.createObjectURL(new Blob([csv],{type:'text/csv'})),el=document.createElement('a');
    el.href=u;el.download='deliveries_'+$('x-from').value+'_to_'+$('x-to').value+'.csv';el.click();URL.revokeObjectURL(u);$('dlg').close();
  };
};
$('mail').onclick=async()=>{
  if(!logs.length)return toast('Nothing to email for this day.');
  const b=$('mail');b.disabled=true;b.textContent='Sending…';
  const {data,error}=await sb.functions.invoke('send-log',{body:{day}});
  b.disabled=false;b.textContent='✉️ Email';
  let msg='';
  if(error){try{const t=await error.context.text();msg=error.context.status+': '+t.slice(0,160)}catch(e){msg=error.message||'unknown error'}}
  else if(data&&data.error)msg=data.error;
  else if(!data||!data.sent)msg='sent 0. Resend did not accept it.';
  msg?toast('Email failed. '+msg,15000):toast('Emailed. Check your inbox.');
};

/* ---------- Google Maps + scanning ---------- */
function setupMaps(){
  const key=gKey();
  if(!key){$('keybox').classList.remove('hide');return}
  window.gm_authFailure=()=>toast('Google rejected the Maps key. Check it and the enabled APIs.');
  new Promise((res,rej)=>{window.__gm=res;const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(key)+'&loading=async&region=NZ&language=en-NZ&callback=__gm';s.onerror=rej;document.head.appendChild(s)})
  .then(async()=>{
    G.maps=await google.maps.importLibrary('maps');G.places=await google.maps.importLibrary('places');G.marker=await google.maps.importLibrary('marker');
    mountSearch();$('mechonly').onchange=mountSearch;renderMap();
  }).catch(()=>toast('Google Maps is unavailable right now (offline?). Typing a shop name still works.'));
}
$('keysave').onclick=()=>{const k=$('keyin').value.trim();if(!k)return;localStorage.setItem('gmkey',k);location.reload()};
function mountSearch(){
  const o={includedRegionCodes:['nz'],locationBias:{center:{lat:-39.35,lng:174.2},radius:50000}};
  if($('mechonly').checked)o.includedPrimaryTypes=['car_repair','car_dealer','car_wash','gas_station'];
  const el=new G.places.PlaceAutocompleteElement(o);
  el.addEventListener('gmp-select',onPick);el.addEventListener('gmp-placeselect',onPick);
  $('searchbox').innerHTML='';$('searchbox').appendChild(el);G.ac=el;picked=null;$('mechrow').classList.remove('hide');mountRet();
}
async function onPick(e){
  try{
    const p=e.placePrediction?e.placePrediction.toPlace():e.place;
    await p.fetchFields({fields:['displayName','formattedAddress','location','id']});
    picked={name:p.displayName,address:p.formattedAddress,lat:p.location.lat(),lng:p.location.lng(),place_id:p.id};
  }catch(err){toast('Couldn’t load that place. Try again.')}
}
function fillFields(c,cls,id,list){c.innerHTML='';list.forEach(v=>{const i=addField(c,cls,v);if(id)i.dataset.id=id})}
function scan(c,cls,id,btn){
  const key=gKey();if(!key)return toast('Add your Google key first.');
  const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.setAttribute('capture','environment');inp.style.display='none';document.body.appendChild(inp);
  inp.onchange=async()=>{
    const f=inp.files[0];inp.remove();if(!f)return;
    const old=btn.textContent;btn.textContent='Reading…';btn.disabled=true;
    try{
      const b64=(await shrink(f,1800,.85)).split(',')[1];
      if(id)pend[id]=await shrink(f,1000,.55);
      const r=await fetch('https://vision.googleapis.com/v1/images:annotate?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({requests:[{image:{content:b64},features:[{type:'DOCUMENT_TEXT_DETECTION'}]}]})});
      const j=await r.json();if(j.error)throw new Error(j.error.message);
      const e=j.responses&&j.responses[0];if(e&&e.error)throw new Error(e.error.message);
      const text=(e&&e.fullTextAnnotation&&e.fullTextAnnotation.text)||'';
      const found=[...new Set([...text.matchAll(/P[S5][I1l|]\s*[:#\-\u2010-\u2015]?\s*([0-9OoIl]{3,})/gi)].map(m=>m[1].replace(/[Oo]/g,'0').replace(/[Il]/g,'1')))];
      found.length?(fillFields(c,cls,id,found),toast('Read '+found.join(', ')+'. Check before logging.'+(id?' Invoice photo will be saved.':''),8000)):toast('No PSI number found. Try a closer, flatter photo.');
    }catch(err){toast(isNet(err)?'No signal. Type the PSI instead.':'Scan failed: '+err.message,10000)}
    btn.textContent=old;btn.disabled=false;
  };
  inp.click();
}
$('pcam').onclick=()=>scan($('ppsis'),'pp',null,$('pcam'));
function renderMap(){
  if(tab!=='map'||!G.maps)return;
  if(!map)map=new G.maps.Map($('map'),{center:{lat:-39.0556,lng:174.0752},zoom:12,minZoom:5,restriction:{latLngBounds:{north:-33.5,south:-48,west:165.5,east:179.5},strictBounds:false},mapId:'DEMO_MAP_ID',streetViewControl:false,mapTypeControl:false});
  mk.forEach(m=>m.map=null);mk=[];iw=iw||new google.maps.InfoWindow();
  const gs=groups().filter(g=>g.lat!=null),bounds=new google.maps.LatLngBounds();
  gs.forEach(g=>{
    const pos={lat:g.lat,lng:g.lng},m=new G.marker.AdvancedMarkerElement({map,position:pos,title:g.name});
    m.addListener('click',()=>{iw.setContent(`<div class="iw"><b>${esc(g.name)}</b><br>${esc(g.address||'')}<hr>${g.items.map(l=>`${fmt(l.delivered_at)} — <b>${esc(pf(l.psi))}</b>${l.note?' · '+esc(l.note):''}`).join('<br>')}${g.picks.map(p=>`<br>↩ ${fmt(p.picked_at)} Pickup${p.note?' · '+esc(p.note):''}`).join('')}</div>`);iw.open({map,anchor:m})});
    mk.push(m);bounds.extend(pos);
  });
  if(gs.length>1)map.fitBounds(bounds,60);else if(gs.length){map.setCenter(bounds.getCenter());map.setZoom(16)}
  const nopin=groups().length-gs.length;
  $('mapnote').textContent=(gs.length?gs.length+' pin'+(gs.length>1?'s':'')+'. Tap one for details.':'No pins for this day.')+(nopin?' '+nopin+' shop(s) have no location.':'');
}

/* ---------- returns / pickups ---------- */
async function loadPickups(a,b){
  const {data,error}=await sb.from('pickups').select('*').gte('picked_at',a.toISOString()).lt('picked_at',b.toISOString()).order('picked_at');
  if(!error)pickups=data||[];
}
function mountRet(){
  if(!G.places)return;
  const o={includedRegionCodes:['nz'],locationBias:{center:{lat:-39.35,lng:174.2},radius:50000}};
  if($('mechonly').checked)o.includedPrimaryTypes=['car_repair','car_dealer','car_wash','gas_station'];
  const el=new G.places.PlaceAutocompleteElement(o);
  const h=async e=>{try{const p=e.placePrediction?e.placePrediction.toPlace():e.place;await p.fetchFields({fields:['displayName','formattedAddress','location','id']});pickedR={name:p.displayName,address:p.formattedAddress,lat:p.location.lat(),lng:p.location.lng(),place_id:p.id};renderRet()}catch(x){toast('Couldn’t load that place. Try again.')}};
  el.addEventListener('gmp-select',h);el.addEventListener('gmp-placeselect',h);
  $('rsearch').innerHTML='';$('rsearch').appendChild(el);G.rac=el;
}
function renderRet(){
  if(!$('rsel'))return;
  $('rsel').innerHTML=pickedR?`📍 <b>${esc(pickedR.name)}</b> <button class="g s" id="rclr">✕</button>`:'';
  if($('rclr'))$('rclr').onclick=()=>{pickedR=null;renderRet()};
}
function renderPickups(){
  $('rlist').innerHTML=pickups.map(p=>`<div class="stop"><div class="row sp"><span><b>↩ ${esc(p.shop_name)}</b> <span class="mut">${fmt(p.picked_at)}${p.photo_path?' 📎':''}</span>${p.note?`<br><span class="mut">${esc(p.note)}</span>`:''}</span><button class="g s" data-pk="${p.id}">View</button></div></div>`).join('')||'<p class="mut">No pickups for this day.</p>';
}
$('rlist').onclick=e=>{const b=e.target.closest('button');if(b&&b.dataset.pk)openPickup(b.dataset.pk)};
$('rcam').onclick=()=>pickPhoto(du=>{rPhoto=du;$('rimg').src=du;$('rimg').style.display='block'});
$('radd').onclick=async()=>{
  const name=((pickedR&&pickedR.name)||(G.rac?G.rac.value:($('rplain')||{}).value)||'').trim();
  if(!name)return toast('Pick or search for a shop.');
  const it={kind:'pickup',photo:rPhoto,row:{id:crypto.randomUUID(),shop_name:name,note:$('rnote').value.trim()||null,picked_at:new Date().toISOString()}};
  if(pickedR)Object.assign(it.row,{place_id:pickedR.place_id,address:pickedR.address,lat:pickedR.lat,lng:pickedR.lng});
  $('radd').disabled=true;
  try{
    if(!navigator.onLine)throw new Error('offline');
    await pushDelivery(it);toast('Pickup logged for '+name);saveShop({name,place_id:it.row.place_id,address:it.row.address,lat:it.row.lat,lng:it.row.lng});
  }catch(err){
    if(isNet(err)){queue.push(it);saveQ();toast('No signal. Saved on your phone and will send when you’re back online.',7000)}
    else{$('radd').disabled=false;return toast(err.message||'Could not log it.')}
  }
  $('radd').disabled=false;pickedR=null;rPhoto=null;$('rnote').value='';$('rimg').style.display='none';
  if(G.rac)G.rac.value='';else $('rplain').value='';
  day=dstr(Date.now());document.querySelectorAll('.dayin').forEach(x=>x.value=day);renderRet();loadLogs();
};
async function openPickup(id){
  const p=pickups.find(x=>x.id===id);if(!p)return;$('dlgbody').onclick=null;
  $('dlgbody').innerHTML=`<b>↩ Pickup · ${esc(p.shop_name)}</b><div class="mut" style="margin:4px 0 10px">${fmt(p.picked_at)}</div><input id="p-note" value="${esc(p.note||'')}" placeholder="Note"><img id="p-img" alt="Photo" style="max-width:100%;border-radius:8px;display:none;margin-bottom:8px"><div class="row"><button id="p-save" style="flex:1">Save note</button><button class="g" id="p-del">Delete</button><button class="g" id="p-x">Close</button></div>`;
  $('dlg').showModal();
  $('p-x').onclick=()=>$('dlg').close();
  $('p-save').onclick=async()=>{const r=await sb.from('pickups').update({note:$('p-note').value.trim()||null}).eq('id',id);if(r.error)return toast(r.error.message);$('dlg').close();loadLogs()};
  $('p-del').onclick=async()=>{if(!confirm('Delete this pickup?'))return;if(p.photo_path)await sb.storage.from('invoices').remove([p.photo_path]);const r=await sb.from('pickups').delete().eq('id',id);if(r.error)return toast(r.error.message);$('dlg').close();loadLogs()};
  if(p.photo_path){const r=await sb.storage.from('invoices').createSignedUrl(p.photo_path,3600);if(r.data&&$('p-img')){$('p-img').src=r.data.signedUrl;$('p-img').style.display='block'}}
}

/* ---------- tabs ---------- */
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('on',x===b));
  ['run','ret','map','log'].forEach(t=>$('v-'+t).classList.toggle('hide',t!==tab));
  if(tab==='map')renderMap();
  if(tab==='ret')renderRet();
});
boot();
</script>
